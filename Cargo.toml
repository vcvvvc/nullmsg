[package]
name = "nullmsg"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "nullmsg"
path = "main.rs"

[dependencies]
toml = "1.0.7"
serde = { version = "1", features = ["derive"] }
base64 = "0.22"
aes = "0.8.4"
cbc = "0.1.2"
tokio = { version = "1.50.0", features = ["full"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = "1.0.149"
rss = "2.0.11"
